[package]
name = "porttasks-search"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Policies over the OSRS Sailing port-task SMDP"
publish = false

[dependencies]
rand = "0.9"
rand_pcg = "0.9"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1          # keep symbols: every release build is one we profile
